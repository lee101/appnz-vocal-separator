<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open stem separator</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui; background: #060606; color: #fff }
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 100%, #3e2914, transparent 48%) }
    main { width: min(760px, 100%); padding: clamp(25px, 6vw, 58px); border: 1px solid #ffffff20; border-radius: 24px; background: #0d0d0dea }
    b { color: #ffbc69; text-transform: uppercase; letter-spacing: .15em; font-size: .75rem }
    h1 { font-size: clamp(2.4rem, 8vw, 5.2rem); line-height: .94; margin: .35em 0 }
    p { color: #aaa }
    label { display: block; margin-top: 15px; font-size: .82rem; font-weight: 700 }
    input, select, button { width: 100%; margin-top: 6px; padding: 14px; border: 1px solid #ffffff24; border-radius: 12px; background: #050505; color: white }
    button { margin-top: 20px; background: #ffbc69; color: #271200; font-weight: 900 }
  </style>
</head>
<body>
  <main>
    <b>Demucs · open weights</b>
    <h1>Pull a song apart.</h1>
    <p>Split vocals from the instrumental—or export drums, bass, vocals, and other—from the public GPU Cog behind this app.nz subdomain.</p>
    <label>Cog model id<input id="id" value="29388d9d-e6b0-4d91-b7ac-55967dcb4428"></label>
    <label>Track<input id="file" type="file" accept="audio/*"></label>
    <label>Stems<select id="stems"><option value="two">Vocals + instrumental</option><option value="four">Four stems</option></select></label>
    <button id="run">Separate track</button>
    <p id="status">Ready.</p>
    <script>
      const $ = x => document.getElementById(x);
      $('run').onclick = async () => {
        const f = $('file').files[0], id = $('id').value.trim();
        if (!f || !id) return $('status').textContent = 'Add a model id and track.';
        const audio = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(f);
        });
        $('status').textContent = 'Queued…';
        const response = await fetch(`https://app.nz/api/cogs/${encodeURIComponent(id)}/predict`, {
          method: 'POST',
          credentials: 'include',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({input: {audio, stems: $('stems').value, format: 'mp3', model: 'htdemucs'}}),
        });
        const body = await response.json();
        $('status').textContent = response.ok ? 'Open Cog Studio to download the finished ZIP.' : (body.error || 'Request failed');
      };
    </script>
  </main>
</body>
</html>
